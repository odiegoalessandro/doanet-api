spring.profiles.active=${SPRING_PROFILES_ACTIVE:test}
spring.application.name=api

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
opencage.api.key=${OPENCAGE_API_KEY}

security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=doanet-api
security.jwt.access-token-ttl=15m
security.jwt.refresh-token-ttl=7d
security.refresh-token.purge.enabled=true
security.refresh-token.purge.interval-ms=86400000
security.refresh-token.purge.initial-delay-ms=60000

spring.datasource.driver-class-name = org.postgresql.Driver
flyway.locations=classpath:db/migration
geolocation.backfill.enabled=true
geolocation.backfill.interval-ms=3600000
geolocation.backfill.initial-delay-ms=60000

server.error.include-stacktrace=never
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
