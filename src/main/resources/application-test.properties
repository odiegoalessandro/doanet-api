spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
opencage.api.key=dummy-key-for-tests

security.jwt.secret=test-secret-only-for-tests-never-use-this-value-32b
security.jwt.access-token-ttl=15m
security.jwt.refresh-token-ttl=7d
security.refresh-token.purge.enabled=false

geolocation.backfill.enabled=false

spring.main.allow-bean-definition-overriding=true
spring.flyway.enabled=false
logging.level.root=ERROR
